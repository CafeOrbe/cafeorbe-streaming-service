          az extension add --name containerapp --upgrade --only-show-errors

          if az containerapp show \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --only-show-errors >/dev/null 2>&1; then

            az containerapp update \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$IMAGE" \
              --min-replicas 1 \
              --set-env-vars \
                "JWT_SECRET=$JWT_SECRET" \
                "DB_URL=jdbc:postgresql://cafeorbe-pg.postgres.database.azure.com:5432/streaming_db" \
                "DB_USER=cafeorbe" \
                "DB_PASSWORD=$DB_PASSWORD" \
                "RABBIT_HOST=toucan.lmq.cloudamqp.com" \
                "RABBIT_PORT=5671" \
                "RABBIT_USER=ebmfpsvi" \
                "RABBIT_PASSWORD=$RABBIT_PASSWORD" \
                "RABBIT_VHOST=ebmfpsvi" \
                "RABBIT_SSL=true" \
                "AUCTION_URL=http://auction-service.internal.thankfulmoss-4f48ec41.eastus2.azurecontainerapps.io" \
                "LIVEKIT_URL=${{ secrets.LIVEKIT_URL }}" \
                "LIVEKIT_API_KEY=$LIVEKIT_API_KEY" \
                "LIVEKIT_API_SECRET=$LIVEKIT_API_SECRET"

          else

            az containerapp create \
              --name "$APP_NAME" \
