server:
  port: 8084
  # DIS-01: al detener una réplica termina las peticiones en curso antes de apagarse.
  shutdown: graceful

spring:
  application:
    name: streaming-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/streaming_db}
    username: ${DB_USER:streaming}
    password: ${DB_PASSWORD:streaming}
    # DIS-01: con varias réplicas, cada una abre su propio pool. El PostgreSQL B1ms de QA admite ~35 conexiones de
    # usuario para los cuatro servicios; con 4 por réplica, auction puede escalar a 4 réplicas sin agotarlas.
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:4}
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:cafeorbe}
    password: ${RABBIT_PASSWORD:cafeorbe}
    virtual-host: ${RABBIT_VHOST:/}
    ssl:
      enabled: ${RABBIT_SSL:false}

cafeorbe:
  seguridad:
    # SEG-02: credencial que presentan el api-gateway y los demás servicios en X-Internal-Token.
    credencial-interna: ${INTERNAL_TOKEN:cafeorbe-dev-credencial-interna-cambiar-en-prod}
  livekit:
    # URL pública a la que se conecta el navegador (no la interna de Docker)
    url: ${LIVEKIT_URL:ws://localhost:7880}
    api-key: ${LIVEKIT_API_KEY:cafeorbe}
    api-secret: ${LIVEKIT_API_SECRET:cafeorbe-livekit-dev-secret-cambiar-en-prod-0123456789}
    minutos-de-vida-del-token: 120
    # URL de la API de servidor de LiveKit vista desde este servicio (cerrar salas, expulsar participantes).
    # Vacía: se deduce de LIVEKIT_URL (ws → http, wss → https), que es lo correcto con LiveKit Cloud.
    api-url: ${LIVEKIT_API_URL:}
  auction:
    # Hallazgos 11 y 17: se consulta el dueño y el estado de la subasta antes de transmitir
    url: ${AUCTION_URL:http://localhost:8082}
    connect-timeout-ms: 1000
    read-timeout-ms: 2000
  outbox:
    scheduler: true
    intervalo-ms: 200
  transmision:
    # Hallazgo 12: si el video del emisor deja de llegar, se espera este tiempo a que vuelva antes de detener.
    # Un microcorte de red o una reconexión de LiveKit se resuelven en pocos segundos.
    gracia-segundos: ${TRANSMISION_GRACIA_SEGUNDOS:20}
    scheduler: true
    intervalo-ms: 5000

logging:
  structured:
    # OBS-01: logs JSON con correlationId (MDC) para Log Analytics.
    format:
      console: ${LOG_FORMAT:logstash}

management:
  # OBS-01: el ingress de Azure reparte entre réplicas, así que un scrape por la URL pública ve una al azar.
  # Cada réplica empuja sus métricas cada 10 s al endpoint OTLP de Grafana Cloud (sin Alloy). Apagado por defecto.
  otlp:
    metrics:
      export:
        enabled: ${OTLP_METRICS_ENABLED:false}
        url: ${OTLP_METRICS_URL:http://localhost:4318/v1/metrics}
        step: ${OTLP_METRICS_STEP:10s}
        headers:
          Authorization: ${OTLP_METRICS_AUTH:}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      # DIS-01: /actuator/health/liveness y /actuator/health/readiness para las sondas de Azure Container Apps.
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      # DIS-01 / OBS-01: réplica que reporta, para medir el reparto entre réplicas y ver cuál cae.
      instancia: ${CONTAINER_APP_REPLICA_NAME:${HOSTNAME:local}}
